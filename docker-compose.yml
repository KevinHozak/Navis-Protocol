version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    volumes:
      - "G:/My Drive/Navis-Protocol:/data/protocol"
    environment:
      - NAVIS_ROOT=/data/protocol
      - PORT=8080

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
