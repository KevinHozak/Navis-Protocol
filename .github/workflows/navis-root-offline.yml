name: NAVIS_ROOT synthetic regressions

on:
  push:
    paths:
      - '.github/workflows/navis-root-offline.yml'
      - 'backend/database/lounge_db.py'
      - 'backend/scripts/sync_lounge.py'
      - 'backend/tray_manager.py'
      - 'backend/tests/test_lounge_tray_root.py'
      - 'backend/tests/conftest.py'
      - 'backend/pytest.ini'
  pull_request:
    paths:
      - '.github/workflows/navis-root-offline.yml'
      - 'backend/database/lounge_db.py'
      - 'backend/scripts/sync_lounge.py'
      - 'backend/tray_manager.py'
      - 'backend/tests/test_lounge_tray_root.py'
      - 'backend/tests/conftest.py'
      - 'backend/pytest.ini'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navis-root-offline:
    name: Windows synthetic NAVIS_ROOT routing
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENROUTER_API_KEY: ''
      NAVIS_OPENROUTER_CONFIG: ''
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/database/lounge_db.py
            /backend/scripts/sync_lounge.py
            /backend/tray_manager.py
            /backend/tests/test_lounge_tray_root.py
            /backend/tests/conftest.py
            /backend/pytest.ini
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Only the test runner is installed; no Navis runtime/integration packages.
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run 10 synthetic root-routing tests
        env:
          NAVIS_ROOT: ${{ runner.temp }}/navis-root-unused-vault
        run: python -m pytest backend/tests/test_lounge_tray_root.py -q -p no:cacheprovider --confcutdir=backend/tests
