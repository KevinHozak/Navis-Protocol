name: Offline recovery regressions

on:
  push:
    paths:
      - '.github/workflows/recovery-offline.yml'
      - 'scripts/test-packaged-recovery.ps1'
      - 'scripts/packaged-recovery-policy.psm1'
      - 'scripts/test-packaged-recovery-policy.ps1'
      - 'scripts/install-actionlint.ps1'
      - 'scripts/check-recovery-workflow.ps1'
      - 'scripts/test-recovery-workflow-lint.ps1'
      - 'scripts/check-recovery-workflow-push.mjs'
      - 'scripts/test-recovery-workflow-push.mjs'
      - '.husky/pre-push'
      - 'docs/packaged-recovery-harness.md'
      - 'docs/webview-process-investigation.md'
  pull_request:
    paths:
      - '.github/workflows/recovery-offline.yml'
      - 'scripts/test-packaged-recovery.ps1'
      - 'scripts/packaged-recovery-policy.psm1'
      - 'scripts/test-packaged-recovery-policy.ps1'
      - 'scripts/install-actionlint.ps1'
      - 'scripts/check-recovery-workflow.ps1'
      - 'scripts/test-recovery-workflow-lint.ps1'
      - 'scripts/check-recovery-workflow-push.mjs'
      - 'scripts/test-recovery-workflow-push.mjs'
      - '.husky/pre-push'
      - 'docs/packaged-recovery-harness.md'
      - 'docs/webview-process-investigation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-offline:
    name: Windows offline recovery policy
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    env:
      NAVIS_AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ''
      NAVIS_OPENROUTER_CONFIG: ''
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/test-packaged-recovery.ps1
            /scripts/packaged-recovery-policy.psm1
            /scripts/test-packaged-recovery-policy.ps1
            /scripts/install-actionlint.ps1
            /scripts/check-recovery-workflow.ps1
            /scripts/test-recovery-workflow-lint.ps1
            /scripts/check-recovery-workflow-push.mjs
            /scripts/test-recovery-workflow-push.mjs
            /.github/workflows/recovery-offline.yml
      - name: Install checksum-pinned actionlint
        run: pwsh -NoProfile -NonInteractive -File scripts/install-actionlint.ps1
      - name: Validate workflow semantics and rejection behavior
        run: pwsh -NoProfile -NonInteractive -File scripts/test-recovery-workflow-lint.ps1
      - name: Test offline pre-push selection
        run: node scripts/test-recovery-workflow-push.mjs
      - name: Run offline recovery regression suite
        env:
          NAVIS_ROOT: ${{ runner.temp }}/navis-offline-unused-vault
        run: pwsh -NoProfile -NonInteractive -File scripts/test-packaged-recovery-policy.ps1
